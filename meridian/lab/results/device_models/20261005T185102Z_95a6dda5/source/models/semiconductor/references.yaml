schema_version: 1
date: '2026-10-05'
policy: Reference intervals retain typical/guaranteed distinction. Typical agreement tolerance is a research accuracy screen, not a production specification.
typical_comparison_relative_tolerance: 0.20
numerical_refinement_relative_tolerance: 0.01
jfe150:
  source: JFE150 SLPS732B table 6.5; pages 5-7
  noise_v_sqrt_hz:
    - {id_a: 0.0001, f_hz: 10, typical: 3.0e-9}
    - {id_a: 0.0001, f_hz: 1000, typical: 2.0e-9}
    - {id_a: 0.002, f_hz: 10, typical: 1.6e-9}
    - {id_a: 0.002, f_hz: 1000, typical: 0.9e-9}
    - {id_a: 0.005, f_hz: 10, typical: 1.8e-9}
    - {id_a: 0.005, f_hz: 1000, typical: 0.8e-9}
  current_noise_a_sqrt_hz: {f_hz: 1000, vds_v: 5, typical: 1.8e-15}
  curve_observations:
    method: Manual coarse readings from original pages rendered to 1600 pixels; intervals include reading uncertainty only, no production distribution. No fit performed.
    transfer_figure_6_1:
      vds_v: 5
      points:
        - {vgs_v: -0.7, current_interval_a: [0.0018, 0.0028]}
        - {vgs_v: -0.4, current_interval_a: [0.009, 0.011]}
        - {vgs_v: 0, current_interval_a: [0.027, 0.029]}
    output_figure_6_3:
      vgs_v: -0.7
      points:
        - {vds_v: 5, current_interval_a: [0.0035, 0.0043]}
        - {vds_v: 20, current_interval_a: [0.0048, 0.0056]}
    conflict: Figures 6-1 and 6-3 differ at VDS=5 V,VGS=-0.7 V beyond coarse reading intervals. Retain both; table guaranteed limits remain distinct.
bipolar:
  bc846b: {hfe_limits: [200, 450], vbe_limits_v: [0.580, 0.700], cc_typical_f: 2.0e-12, cc_max_f: 3.0e-12, vcesat_max_v: 0.200}
  bc856b: {hfe_limits: [220, 475], vbe_limits_v: [0.600, 0.750], cc_typical_f: 4.5e-12, cc_max_f: null, vcesat_max_v: 0.300}
  gain_vbe_condition: VCE magnitude 5 V, IC magnitude 2 mA,25 C
  cc_condition: VCB magnitude10 V,emitter open,f1MHz
  saturation_condition: IC magnitude10mA,IB magnitude0.5mA,25C
  ft_condition: VCE magnitude5V,IC magnitude10mA,f100MHz; minimum100MHz
  noise_figure: {typical_db: 2, max_db: 10, ic_a: 0.0002, vce_v: 5, rs_ohm: 2000, f_hz: 1000, bandwidth_hz: 200}
  limitation: Datasheets supply noise figure rather than separate voltage/current or 1/f spectra. A generic shot-noise result is insufficient for low-noise front-end qualification.
opa197:
  source: SBOS737C tables6.7/6.8; VCM near midsupply,load10k
  supply_v: 36
  voltage_noise_v_sqrt_hz: {100: 1.05e-8, 1000: 5.5e-9}
  current_noise_a_sqrt_hz: {1000: 1.5e-15}
  gbw_typical_hz: 1.0e+7
  input_common_capacitance_typical_f: 6.4e-12
  input_diff_capacitance_typical_f: 1.6e-12
  iq_typical_a: 0.001
  iq_max_25c_a: 0.0013
  ib_max_25c_a: 2.0e-11
  output_headroom_max_v_2k: 0.500
  limitation: Typical noise is not a guaranteed maximum. Only tested bias/common-mode/supply conditions receive coverage.
