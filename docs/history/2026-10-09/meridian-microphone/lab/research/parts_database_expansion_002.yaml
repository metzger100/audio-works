role_gap_matrix:
- id: high_impedance
  role: High-impedance voltage/charge input
  device_ids:
  - jfe150
  - jfe2140
  - lsk170a
  - lsk389a
  - mmbfj113
  remaining_gap: Only JFE150 at baseline; J113 no model. New dual and independent
    maker allow DC comparisons, but current/flicker/high-field leakage and process
    correlation block complete noise/charge controls. LSK389 child exposes ignored
    ISR/NR/ALPHA/VK; no accepted behavior credit.
  next_falsification: Freeze reduced charge-input oracle before candidate0012 alternatives;
    compare actual100uA/2mA spectra and capsule45-100pF envelope.
- id: low_noise_bipolar
  role: Low-noise bipolar amplification
  device_ids:
  - bc846b
  - bc850c
  remaining_gap: BC850C adds ordinary high-beta/NF evidence; base-current authority
    still conflicts with1Gohm leakage; no KF in either model.
  next_falsification: Separate200uA Rs2k narrowband NF from voltage/current noise
    spectra and low-current charge authority.
- id: p48_power
  role: High-voltage P48 power/current control
  device_ids:
  - pmbt5551
  - diotec_mmbt5551
  - vishay_2n7002k
  - diodes_mmbt5401
  - dmmt5401
  - diotec_2n5551
  remaining_gap: Complementary exact PNP model gap closed for limited DC/cap/leak
    controls. Flicker, breakdown/SOA, P48 electrothermal feedback and production variation
    remain unresolved; Diotec backend warnings block accepted behavior.
  next_falsification: DC current regulator with real resistor feedback, P48 feed drop,
    coupled temperature, startup/reversal and dissipation oracle first.
- id: balanced_output
  role: Low-noise balanced output
  device_ids:
  - bc846b
  - bc856b
  - pmbt5551
  - opa1656
  - diodes_mmbt5401
  - dmmt5401
  - diotec_2n5551
  remaining_gap: DMMT5401 ordinary adjacent-die2percent matching documented; package300mW
    combined. Nominal halves do not validate matching/noise/thermal correlation, actual
    output loading or the complete P48 budget.
  next_falsification: Derive total quiescent + load currents; exact complementary
    BJT model prerequisite before balanced HV output experiments.
- id: guard_servo
  role: CMOS/electrometer/guard/servo
  device_ids:
  - opa197
  - opa928
  - lmp7721
  remaining_gap: OPA928 supports grounded follower/noise at some supply/temperature
    points, others warn/timeout. ADA4530 licence gate. No floating/guard-loaded/charge/noise
    validation. Explicit nodeset preserves grounded OPA928 point but translated+20V
    fails; OPA1656/LMP7721 still time out.
  next_falsification: Grounded versus floating identical oracle and common-mode/guard
    load sweep; humidity/board leakage remains physical unknown.
- id: carrier
  role: Carrier excitation/demodulation
  device_ids: []
  remaining_gap: TMUX1102 adds conditioned injection/Ron/leak test method; IBIS is
    not analog SPICE. No acquired periodic-noise model, regulator/startup/common-mode
    or demodulator validation.
  next_falsification: Continue isolated carrier oracle; real switch charge injection/Ron/leakage,
    oscillator and demodulator synchronous noise prerequisite; no ideal-block credit.
- id: protection
  role: Protection
  device_ids:
  - bav199
  - jfe2140
  remaining_gap: BAV199 one-diode syntax child passes75V25C leakage bound and0V1MHz
    cap bound. Double package plus humidity/high-T/turn-on/recovery not qualified.
  next_falsification: Add protection only after actual node voltage and leakage-noise
    budget;5nA worst bound forbids assuming femtoampere loading.
- id: high_r
  role: High-R/low-leakage passives
  device_ids: []
  remaining_gap: ExistingHVA12JA1G00 thickfilm high-V resistor; excess noise and surface
    leakage unknown.500M series and CRHV are leads, no substitute qualification.
  next_falsification: Couple gate leak, DC authority, VCR, board leakage, TCR and
    dielectric losses; documented limits are not a broadband law.
- id: capacitors
  role: Practical coupling/compensation capacitors
  device_ids: []
  remaining_gap: Exact WIMA100nF100V10percent PP dimensions/IR/DF documented; seller
    shows0stock and temperature conflict. Existing1nF C0G loss methods and parallel
    electrolytic law/combination qualification unresolved.
  next_falsification: C0G1nF feedback/compensation control and PP series research;
    output electrolytic optimization stays below bias/noise gaps.
