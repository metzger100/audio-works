schema_version: 1
date: '2026-10-16'
scope: Prompt10 isolated prerequisite controls; no periodic Inventor challenge or optimization
acceptance_or_budget_changes: none
budget_relationship: Separate finite diagnostic jobs, zero optimizer vectors; no reuse of exhausted reservations
maximum_jobs: 60
timeout_s_per_job: 15
options: reltol=1e-6 abstol=1e-16 vntol=1e-10 gmin=1e-15 method=gear maxord=2
models: [bc846b_emitter_r1, opa197_pspice, opa928_vendor]
parents: [candidate_0012, candidate_0024, candidate_0010, candidate_0014, candidate_0013]
tracks:
  bjt:
    hypothesis: Finite gain, reset conductance and base current jointly constrain charge conversion; smaller Cf alone cannot rescue LF
    jobs: 18
    conditions: Cf100nF/99.9001pF; R500k/100M; Ctotal45/70/100pF plus2pF; A0=10, pole100kHz
    analyses: [independent_complex_KCL, finite_gain_AC, DC_reset, exponential_reset, noise_envelope, exact_parent_nominal_DC_AC]
    stop: No structural child until DC authority, LF conversion and independent noise prerequisites support it; preserve no-FET niche
  cmos:
    hypothesis: Complete terminal/reference translation leaves physical relative voltages and supply currents invariant
    jobs: 28
    conditions: OPA197/OPA928; 16V rail; CM8V; shifts0,+20,-20V; CM0.1/15.9 grounded; charge70pF,Cf100pF,R1G
    analyses: [DC_AC_terminal_currents, ideal_gauge_control, grounded_charge, translated_charge, guard_load_AC, guard_positive_feedback_oracle, reset_settling]
    stop: No vendor internal edits, nodeset search or tolerances search; warning/timeout is unsupported behavior, never family rejection
  carrier:
    hypothesis: A seeded ideal noisy bridge/mixer/filter agrees with independent sideband and covariance power calculations
    jobs: 4
    conditions: Retain four island controls; fc100kHz, fa1kHz, R1k,C100nF; seeded discrete periodic calculation separate from native device noise
    seeds: [34047, 44047, 54047, 64047]
    numerical_sizes: [131072, 262144]
    sample_rates_hz: [800000, 1600000]
    analyses: [deterministic_recovery_zero_carrier_off, independent_frequency_shift_covariance, seeded_ensemble_PSD, source_calibration, window_sampling_settling_refinement]
    stop: Seeded ideal mechanism gets no native device/microphone noise rating; absent periodic device protocol stays explicit
oracle_screens:
  complex_relative_error: 0.01
  reset_absolute_error_v: 1.0e-5
  translation_relative_voltage_error_v: 0.001
  translation_current_fraction: 0.01
  seeded_power_fraction: 0.10
  note: Local diagnostic screens only, no microphone thresholds amended; all failures retained
