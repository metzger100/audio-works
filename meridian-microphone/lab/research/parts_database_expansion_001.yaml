no_selection: true
role_gap_matrix:
- id: high_impedance
  role: High-impedance voltage/charge input
  device_ids:
  - jfe150
  - jfe2140
  - lsk170a
  - lsk389a
  - mmbfj113
  remaining_gap: Only JFE150 at baseline; J113 no model. New dual and independent maker allow
    DC comparisons, but current/flicker/high-field leakage and process correlation block complete
    noise/charge controls.
  next_falsification: Freeze reduced charge-input oracle before candidate0012 alternatives;
    compare actual100uA/2mA spectra and capsule45-100pF envelope.
- id: low_noise_bipolar
  role: Low-noise bipolar amplification
  device_ids:
  - bc846b
  - bc850c
  remaining_gap: BC850C adds ordinary high-beta/NF evidence; base-current authority still conflicts
    with1Gohm leakage; no KF in either model.
  next_falsification: Separate200uA Rs2k narrowband NF from voltage/current noise spectra and
    low-current charge authority.
- id: p48_power
  role: High-voltage P48 power/current control
  device_ids:
  - pmbt5551
  - diotec_mmbt5551
  - vishay_2n7002k
  remaining_gap: PMBT5551 offers exact160V NPN model; open-emitter capacitance/leakage warnings
    and no electrothermal/SOA model. Ordinary150V PNP remains documentary with no acquired model.
  next_falsification: DC current regulator with real resistor feedback, P48 feed drop, coupled
    temperature, startup/reversal and dissipation oracle first.
- id: balanced_output
  role: Low-noise balanced output
  device_ids:
  - bc846b
  - bc856b
  - pmbt5551
  - opa1656
  remaining_gap: Baseline output matching/leakage/noise unresolved. OPA1656 dual macro acquired;
    power budget and floating/loaded current control untested.
  next_falsification: Derive total quiescent + load currents; exact complementary BJT model
    prerequisite before balanced HV output experiments.
- id: guard_servo
  role: CMOS/electrometer/guard/servo
  device_ids:
  - opa197
  - opa928
  - lmp7721
  remaining_gap: OPA928 supports grounded follower/noise at some supply/temperature points,
    others warn/timeout. ADA4530 licence gate. No floating/guard-loaded/charge/noise validation.
  next_falsification: Grounded versus floating identical oracle and common-mode/guard load sweep;
    humidity/board leakage remains physical unknown.
- id: carrier
  role: Carrier excitation/demodulation
  device_ids: []
  remaining_gap: CD74HC4053PWR has primary current/leakage/capacitance evidence but no acquired
    analog model; AD630 model route/terms and periodic noise unresolved.
  next_falsification: Continue isolated carrier oracle; real switch charge injection/Ron/leakage,
    oscillator and demodulator synchronous noise prerequisite; no ideal-block credit.
- id: protection
  role: Protection
  device_ids:
  - bav199
  - jfe2140
  remaining_gap: BAV199 one-diode syntax child passes75V25C leakage bound and0V1MHz cap bound.
    Double package plus humidity/high-T/turn-on/recovery not qualified.
  next_falsification: Add protection only after actual node voltage and leakage-noise budget;5nA
    worst bound forbids assuming femtoampere loading.
- id: high_r
  role: High-R/low-leakage passives
  device_ids: []
  remaining_gap: ExistingHVA12JA1G00 thickfilm high-V resistor; excess noise and surface leakage
    unknown.500M series and CRHV are leads, no substitute qualification.
  next_falsification: Couple gate leak, DC authority, VCR, board leakage, TCR and dielectric
    losses; documented limits are not a broadband law.
- id: capacitors
  role: Practical coupling/compensation capacitors
  device_ids: []
  remaining_gap: 14baseline exact passives preserved; one new1nF C0G exact document. PET/PP
    loss, insulation, absorption, dimensions and polar47uF parallel arrangements need exact
    combinations.
  next_falsification: C0G1nF feedback/compensation control and PP series research; output electrolytic
    optimization stays below bias/noise gaps.
