questions:
  sensed_quantity: front/rear capacitance modulation of an anti-phase analog carrier
  loading: floating capacitor bridge; 100 pF fixed references; both input buffer loads
    explicit
  dc_bias: filtered DC backplate and midrail electrode returns; no physical safe RF/DC
    rating inferred
  gain_or_impedance_transformation: bridge sidebands then synchronous product and
    two-pole RC low-pass
  balanced_output: Real output devices and two 47 ohm/47 uF legs; harvest/cable/load
    coupling measured, symmetry not presumed
  expected_noise: periodic device noise, oscillator AM/PM and mixer folding; ordinary
    DC noise is invalid
  expected_distortion: bridge imbalance, product/filters, force/back-action absent
    from capsule model
  likely_fatal_flaw: unimplemented oscillator/mixer power/noise and unvalidated periodic
    protocol
  quickest_falsification: carrier on/off pressure sidebands, demodulation phase, step
    refinement and analytic charge-control oracle
  hypothesis: A floating bridge should create pressure-dependent carrier sidebands;
    an ideal oscillator/multiplier can isolate this mechanism without qualifying a
    hardware architecture.
