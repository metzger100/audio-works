questions:
  sensed_quantity: front voltage above the slow servo bandwidth
  loading: 1 GOhm gate servo injection; finite input C
  dc_bias: NPN differential error compares source/4 with rail/16; resistor tail, capacitor
    slow path and explicit base-current error; source resistor sets current
  gain_or_impedance_transformation: audio source follower; DC loop has separate authority
    and bandwidth
  balanced_output: NPN follower plus emitter-degenerated NPN inverse/follower; finite
    unequal impedances measured
  expected_noise: servo voltage noise through gate resistor, JFE flicker/current noise
    and output noise
  expected_distortion: servo/audio interaction, rail-dependent reference and clipping
  likely_fatal_flaw: insufficient servo authority or loop instability
  quickest_falsification: source-current DC, leakage extremes, startup and audio/servo
    return ratio
  hypothesis: 3 parallel documented 47uF output parts per leg may retain continuous
    LF benefit under independent/correlated capacitance, leakage and loss stress;
    no source/model/production qualification follows.
