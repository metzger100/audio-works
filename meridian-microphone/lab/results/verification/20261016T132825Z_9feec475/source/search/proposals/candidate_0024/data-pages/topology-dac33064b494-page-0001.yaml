hypothesis: An entirely BJT audio/power path can perform charge feedback without a
  FET, but base-current noise and DC authority may dominate the LF budget.
structural_changes: Specify obtainable AC-series 10k parts and test a 500kohm DC feedback
  branch realized as two parallel 1Mohm resistors. Lower reset resistance trades base-current
  authority against charge gain/noise; no selection or excess-noise equivalence. Preserve
  BJT-only mechanism and rerun complete supported suite.
