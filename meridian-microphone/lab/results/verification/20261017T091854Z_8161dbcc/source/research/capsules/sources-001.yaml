  SC25:
    title: Mylar polyester film Physical-Thermal Properties H-37232-3
    author_or_manufacturer: DuPont Teijin Films
    url: https://stenbacka.fi/wp-content/uploads/sites/3/2016/07/mylar_a_fysikaaliset_ominaisuudet.pdf
    kind: manufacturer-authored bulletin, distributor-hosted original
    revision: 06/2003, replaces H-37232-2; search dates conflict with printed revision
