questions:
  sensed_quantity: front open-circuit voltage
  loading: JFE input C, 1 GOhm gate bias; source follower reduces Cgs loading
  dc_bias: gate at rail/4; 3.3 kohm source degeneration; fixed parts across device
    spread
  gain_or_impedance_transformation: source follower then AC coupling into real CMOS
    differential driver
  balanced_output: NPN follower plus emitter-degenerated NPN inverse/follower; finite
    unequal impedances measured
  expected_noise: JFE voltage/current/flicker plus gate/polarization resistors and
    both output opamps
  expected_distortion: source-follower curvature, drain modulation and output clipping
  likely_fatal_flaw: production corner bias/noise/model coverage
  quickest_falsification: Full stationary-noise contribution comparison with parent;
    preserved DC and transfer, then all supported tests
  hypothesis: 2 parallel documented 47uF output parts per leg may retain continuous
    LF benefit under independent/correlated capacitance, leakage and loss stress;
    no source/model/production qualification follows.
