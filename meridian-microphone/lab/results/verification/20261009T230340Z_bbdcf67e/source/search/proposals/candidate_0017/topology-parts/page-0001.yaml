hypothesis: If the unfiltered final 1Mohm backplate feed dominates the conventional
  reference noise, an actual 100nF backplate bypass should lower that contribution
  without selecting a JFET or changing voltage conversion.
structural_changes: Retain JFE source degeneration, all bias/output devices and nominal
  values. Add one ordinary 100nF 100V PET capacitor after the final backplate resistor,
  testing its observed dominant Johnson-noise path. No trimming or device selection;
  rerun full suite.
