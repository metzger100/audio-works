questions:
  sensed_quantity: front displacement charge at a bipolar summing input
  loading: finite differential-pair loop; base shot noise remains
  dc_bias: fixed midrail pair and degenerated tail; 1 Mohm DC feedback supplies base
    current
  gain_or_impedance_transformation: discrete differential error amplifier, 100 nF
    feedback and emitter followers
  balanced_output: Real output devices and two 47 ohm/47 uF legs; harvest/cable/load
    coupling measured, symmetry not presumed
  expected_noise: base-current shot noise, feedback resistor and collector/output
    noise; missing KF explicitly unknown
  expected_distortion: differential pair curvature, finite loop gain, unequal follower
    bias
  likely_fatal_flaw: low reset resistance requires very large Cfb and loses sensitivity/SNR
  quickest_falsification: base current/feedback authority, pressure-referred shot
