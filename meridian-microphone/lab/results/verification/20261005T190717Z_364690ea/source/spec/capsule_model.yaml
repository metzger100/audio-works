unknown:
  - current lead assignments and electrode isolation
  - diaphragm gap, tension, damping and active diameter
  - capacitance versus polarization and electrostatic spring softening
  - mechanical resonance and frequency/angle transfer
  - intrinsic acoustic/Brownian noise and pressure overload
  - leakage excess noise, humidity and contamination dependence
  - production distributions and parameter correlations
electrical_model:
  law: Q=C0*(1+k*p)*V_electrode; I=dQ/dt; k=Sref/Vref
  pressure_port: One volt represents one pascal; distinct front/rear pressure ports, no inferred polar acoustics.
  linearity_domain: abs(k*p_peak) <= 0.05 is a conservative assumed screening limit, not a capsule mechanical limit.
  linearized_mode: Q=C0*V_electrode-C0*k*Vpol_dc*p; isolates electronics distortion using the measured simulated DC polarization.
  limitations: Imposed linear mechanical compliance; no acoustic resistance, diaphragm thermal noise, pull-in, electromechanical back-action or real mechanical distortion. High-SPL claims remain unqualified.
measurements_to_reduce_uncertainty:
  - Electrode/lead continuity and isolation without stressing diaphragm.
  - Front/rear capacitance with known fixture parasitics; frequency and bias dependence where safe.
  - Sensitivity and spectra at a manufacturer-approved bias with calibrated acoustic pressure and de-embedded fixture.
  - Leakage after settling at controlled humidity and temperature, and leakage noise spectrum.
  - Acoustic noise/overload and angular response with the intended headbasket.
