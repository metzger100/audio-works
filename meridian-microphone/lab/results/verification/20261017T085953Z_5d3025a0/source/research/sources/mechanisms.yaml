S05:
  title: TI SLOA033A, Signal Conditioning Piezoelectric Sensors, James Karki, 2000
  url: https://www.ti.com/lit/an/sloa033a/sloa033a.pdf
  kind: primary_application_report
  mechanism: Charge-to-voltage feedback reduces dependence on sensor/interconnect
    capacitance; bleed path prevents DC saturation.
S06:
  title: Analog Devices ADA4530-1 Rev C datasheet
  url: https://www.analog.com/media/en/technical-documentation/data-sheets/ADA4530-1.pdf
  kind: primary_datasheet
  mechanism: Low bias current and a driven guard isolate leakage at high-impedance
    sensor nodes. Voltage noise, current, supply and layout must still be evaluated
    for audio use.
S07:
  title: Analog Devices, Transimpedance Amplifier Noise Considerations, 2015
  url: https://www.analog.com/en/resources/technical-articles/transimpedance-amplifier-noise-considerations.html
  kind: primary_manufacturer_application_article
  mechanism: Voltage/current noise, total input capacitance and feedback impedance
    jointly determine TIA noise and stability.
S08:
  title: Fast low-noise transimpedance amplifier for scanning tunneling microscopy
    and beyond, 2020
  url: https://arxiv.org/abs/2007.00615
  kind: primary_research_paper
  mechanism: High-resistance feedback with low-current sensing; evaluate Johnson noise,
    capacitance, bandwidth and dynamic range together.
S09:
