scope: Continuation002 own observations; original bytes private; no orders/contacts/licence
  acceptance
question_source_matrix:
- role: high_impedance
  question: Only JFE150 at baseline; J113 no model. New dual and independent maker
    allow DC comparisons, but current/flicker/high-field leakage and process correlation
    block complete noise/charge controls. LSK389 child exposes ignored ISR/NR/ALPHA/VK;
    no accepted behavior credit.
  primary_routes:
  - https://www.ti.com/product/JFE2140
  - https://www.linearsystems.com/jfet-amplifiers-duals/lsk389-series
  - https://www.onsemi.com/
  followup: Freeze reduced charge-input oracle before candidate0012 alternatives;
    compare actual100uA/2mA spectra and capsule45-100pF envelope.
- role: low_noise_bipolar
  question: BC850C adds ordinary high-beta/NF evidence; base-current authority still
    conflicts with1Gohm leakage; no KF in either model.
  primary_routes:
  - https://www.nexperia.com/product/BC850C
  - https://www.ti.com/lit/pdf/SBOA345
  followup: Separate200uA Rs2k narrowband NF from voltage/current noise spectra and
    low-current charge authority.
- role: p48_power
  question: Complementary exact PNP model gap closed for limited DC/cap/leak controls.
    Flicker, breakdown/SOA, P48 electrothermal feedback and production variation remain
    unresolved; Diotec backend warnings block accepted behavior.
  primary_routes:
  - https://www.nexperia.com/product/PMBT5551
  - https://www.diodes.com/part/view/MMBT5401/
  - https://diotec.com/en/product/2N5551.html
  followup: DC current regulator with real resistor feedback, P48 feed drop, coupled
    temperature, startup/reversal and dissipation oracle first.
- role: balanced_output
  question: DMMT5401 ordinary adjacent-die2percent matching documented; package300mW
    combined. Nominal halves do not validate matching/noise/thermal correlation, actual
    output loading or the complete P48 budget.
  primary_routes:
  - https://www.diodes.com/part/view/DMMT5401/
  - https://www.ti.com/product/OPA1656
  - https://www.ti.com/lit/pdf/SBOA320
  followup: Derive total quiescent + load currents; exact complementary BJT model
    prerequisite before balanced HV output experiments.
- role: guard_servo
  question: OPA928 supports grounded follower/noise at some supply/temperature points,
    others warn/timeout. ADA4530 licence gate. No floating/guard-loaded/charge/noise
    validation. Explicit nodeset preserves grounded OPA928 point but translated+20V
    fails; OPA1656/LMP7721 still time out.
  primary_routes:
  - https://www.ti.com/product/OPA928
  - https://www.ti.com/product/LMP7721
  followup: Grounded versus floating identical oracle and common-mode/guard load sweep;
    humidity/board leakage remains physical unknown.
- role: carrier
  question: TMUX1102 adds conditioned injection/Ron/leak test method; IBIS is not
    analog SPICE. No acquired periodic-noise model, regulator/startup/common-mode
    or demodulator validation.
  primary_routes:
  - https://www.ti.com/product/TMUX1102
  - https://www.ti.com/product/CD74HC4053
  - https://www.analog.com/en/products/ad630.html
  followup: Continue isolated carrier oracle; real switch charge injection/Ron/leakage,
    oscillator and demodulator synchronous noise prerequisite; no ideal-block credit.
- role: protection
  question: BAV199 one-diode syntax child passes75V25C leakage bound and0V1MHz cap
    bound. Double package plus humidity/high-T/turn-on/recovery not qualified.
  primary_routes:
  - https://www.nexperia.com/product/BAV199
  followup: Add protection only after actual node voltage and leakage-noise budget;5nA
    worst bound forbids assuming femtoampere loading.
- role: high_r
  question: ExistingHVA12JA1G00 thickfilm high-V resistor; excess noise and surface
    leakage unknown.500M series and CRHV are leads, no substitute qualification.
  primary_routes:
  - https://www.ohmite.com/catalog/rx-1m-hi-meg/RX-1M1007FE/
  - https://www.vishay.com/docs/68002/crhv.pdf
  followup: Couple gate leak, DC authority, VCR, board leakage, TCR and dielectric
    losses; documented limits are not a broadband law.
- role: capacitors
  question: Exact WIMA100nF100V10percent PP dimensions/IR/DF documented; seller shows0stock
    and temperature conflict. Existing1nF C0G loss methods and parallel electrolytic
    law/combination qualification unresolved.
  primary_routes:
  - https://www.wima.de/wp-content/uploads/media/e_WIMA_MKP_2.pdf
  - https://yageogroup.com/download/specsheet/CC0603JRNPO0BN102
  followup: C0G1nF feedback/compensation control and PP series research; output electrolytic
    optimization stays below bias/noise gaps.
