questions:
  sensed_quantity: front displacement charge
  loading: virtual midrail at front; 100 pF feedback capacitor sets conversion
  dc_bias: 1 GOhm feedback bleed supplies input bias and capsule leakage; DC authority
    explicitly finite
  gain_or_impedance_transformation: Q/Cfb then real inverted output
  balanced_output: NPN follower plus emitter-degenerated NPN inverse/follower; finite
    unequal impedances measured
  expected_noise: feedback thermal/excess noise, CMOS en times noise gain and in,
    output driver noise
  expected_distortion: finite loop gain, DC leakage saturation and rail clipping
  likely_fatal_flaw: leakage times 1 GOhm exhausts swing
  quickest_falsification: DC at LEAK=1G then charge transfer/noise across C/leakage
    corners
  hypothesis: Capacitive feedback may flatten electrical charge conversion while a
    finite resistive reset prevents indefinite drift only within measured DC authority.
