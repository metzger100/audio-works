      include reading uncertainty only, no production distribution. No fit performed.
    transfer_figure_6_1:
      vds_v: 5
      points:
      - vgs_v: -0.7
        current_interval_a:
        - 0.0018
        - 0.0028
      - vgs_v: -0.4
        current_interval_a:
        - 0.009
        - 0.011
      - vgs_v: 0
        current_interval_a:
        - 0.027
        - 0.029
    output_figure_6_3:
      vgs_v: -0.7
      points:
      - vds_v: 5
        current_interval_a:
        - 0.0035
        - 0.0043
      - vds_v: 20
        current_interval_a:
        - 0.0048
        - 0.0056
    conflict: Figures 6-1 and 6-3 differ at VDS=5 V,VGS=-0.7 V beyond coarse reading
      intervals. Retain both; table guaranteed limits remain distinct.
