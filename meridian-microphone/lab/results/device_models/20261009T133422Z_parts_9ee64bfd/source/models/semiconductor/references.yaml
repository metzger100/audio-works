schema_version: 1
vishay_2n7002k:
  evidence_date: '2026-10-09'
  datasheet: https://www.vishay.com/docs/71333/2n7002k.pdf
  version: Document71333 Rev.F21-Aug-2017
  table_conditions: TA25C unless specified; marked pulse tests<=300us,duty<=2%; dynamic
    values are design aids, not production tested.
  threshold:
    id_a: 0.00025
    drain_tied_to_gate: true
    limits_v:
    - 1
    - 2.5
  rds_on:
  - vgs_v: 10
    id_a: 0.5
    maximum_ohm: 2
  - vgs_v: 4.5
    id_a: 0.2
    maximum_ohm: 4
  gfs:
    vds_v: 10
    id_a: 0.2
    minimum_s: 0.1
  capacitance:
    conditions: VDS25V,VGS0V,1MHz,25C
    table_typical_f:
      ciss: 3.0e-11
      coss: 6.0e-12
      crss: 2.5e-12
    graph_intervals_f:
      ciss:
      - 1.9e-11
      - 2.2e-11
      coss:
      - 5.5e-12
      - 7.0e-12
      crss:
      - 2.0e-12
      - 3.5e-12
    source_disagreement: Table Ciss30pF and page3 graph near20pF disagree. Preserve
      both; no favorable choice or fitting.
  output_curve_observations:
    reference: Page3 Output Characteristics;25C, typical pulsed data; coarse visual
      intervals from140dpi rendered source.
    points:
    - vgs_v: 3
      vds_v: 5
      current_interval_a:
      - 0.04
      - 0.06
    - vgs_v: 4
      vds_v: 5
      current_interval_a:
      - 0.35
      - 0.4
    - vgs_v: 5
      vds_v: 5
      current_interval_a:
      - 0.71
      - 0.78
    - vgs_v: 10
      vds_v: 1
      current_interval_a:
      - 0.4
      - 0.49
  transfer_curve:
    conditions_status: Page3 does not specify drain bias in transfer plot; record10V
      simulation without a condition-matched acceptance claim.
    reference_only_point:
      vgs_v: 4
      current_interval_a:
      - 0.56
      - 0.65
      temperature_c: 25
  rds_temperature:
    reference: Page3 normalized RDS(on) at125C; typical visual interval, relative
      to25C, same bias.
    normalized_interval:
    - 1.5
    - 1.7
  gate_leakage:
    conditions: VDS0V,VGS+/-5V,25C
    maximum_a: 1.0e-07
    qualification: No simulated credit; selected model omits gate leakage/ESD.
  noise_spectra: null
  noise_status: No primary voltage/current/1f spectrum found; KF absent in model.
    Native white noise does not validate low-noise input behavior.
date: '2026-10-05'
policy: Reference intervals retain typical/guaranteed distinction. Typical agreement
  tolerance is a research accuracy screen, not a production specification.
typical_comparison_relative_tolerance: 0.2
numerical_refinement_relative_tolerance: 0.01
