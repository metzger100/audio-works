questions:
  sensed_quantity: front voltage
  loading: finite CMOS Cin; guard follows front; bias return bootstrapped in audio
  dc_bias: midrail through 1 GOhm; guard DC anchored by 1 Mohm
  gain_or_impedance_transformation: OPA197 follower plus finite-bandwidth guard buffer
  balanced_output: NPN follower plus emitter-degenerated NPN inverse/follower; finite
    unequal impedances measured
  expected_noise: input CMOS en/in/1f, guard coupling and both output channels
  expected_distortion: common-mode crossover and positive-feedback tracking error
  likely_fatal_flaw: guard noise or instability exceeds loading benefit
  quickest_falsification: compare guarded/untracked admittance and noise with assumed
    0.5-10 pF geometry
  hypothesis: A real follower guard may reduce external capacitive/leakage loading;
    it cannot erase the opamp intrinsic input capacitance.
