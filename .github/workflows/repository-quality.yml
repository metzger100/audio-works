name: Repository quality
'on': [push, pull_request]
permissions:
  contents: read
jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned quality dependencies
        run: python -m pip install -r requirements-quality.txt
      - name: Validate committed tree and preservation
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          python tools/project.py check --ref HEAD --base "$BASE"
      - name: Git and preservation regression suite
        run: python -m unittest discover -s tests/project -q
